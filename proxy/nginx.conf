# Base configuration of the microservice-updater reverse proxy (issue #149).
#
# The per-service listeners in conf.d are generated by the updater: one
# `server` block per registered port mapping, forwarding to the ephemeral
# loopback port of the currently active (blue or green) container. Because
# the proxy runs with host networking, new listeners only need a reload --
# the proxy container is never recreated when a service is registered or
# its port is patched.
#
# Forwarding happens on layer 4, so the proxied protocol does not matter:
# HTTP, TLS-terminating services and plain TCP work alike.

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format proxy '$remote_addr [$time_local] $protocol $status $bytes_sent '
                     '$bytes_received $session_time "$upstream_addr"';
    access_log /var/log/nginx/access.log proxy;

    proxy_connect_timeout 5s;
    proxy_timeout 10m;

    # written by the microservice-updater, one file per registered service
    include /etc/nginx/conf.d/*.conf;
}
